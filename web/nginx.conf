server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy — the Angular app always calls /api (see environment.ts), and
    # nginx forwards that to the api container by its compose network hostname. This means
    # production needs no CORS configuration at all: the browser never sees a cross-origin
    # request, exactly like ng serve's proxy.conf.json does for local development.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular client-side routing: any path that isn't a real static file falls back to
    # index.html so the Angular router (not nginx) decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
